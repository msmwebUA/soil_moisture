# Minimal working config. eclipse-mosquitto 2.x refuses ALL connections
# without an explicit listener + auth policy, so this is required, not optional.

listener 1883
allow_anonymous true

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# --- For anything beyond local testing ---
# Anonymous access on an internal docker network is fine for a first setup,
# but if you publish port 1883 to the internet, switch to authenticated access:
#
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#
# then create it with:
#   docker exec -it lw-mosquitto mosquitto_passwd -c /mosquitto/config/passwd chirpstack