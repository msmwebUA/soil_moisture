; Wio-E5 mini soil node

[env:lora_e5_mini]
platform  = ststm32
board     = lora_e5_mini
framework = arduino

upload_protocol = stlink ; ST-LINK/V2 over SWD (USB-C on the board is only a serial bridge)
debug_tool      = stlink

monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@^7.8.1
    stm32duino/STM32duino Low Power
    stm32duino/STM32duino RTC
    paulstoffregen/OneWire
    milesburton/DallasTemperature

